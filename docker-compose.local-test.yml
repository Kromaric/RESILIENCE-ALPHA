name: orbe-local-test

services:
  mariadb:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-mariadb }
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTH_SVC_PASSWORD_FILE: /run/secrets/auth_db_password
      MARIADB_PAYMENT_SVC_PASSWORD_FILE: /run/secrets/payment_db_password
      MARIADB_REMEDIATION_RO_PASSWORD_FILE: /run/secrets/remediation_db_password
      MARIADB_EXPORTER_PASSWORD_FILE: /run/secrets/exporter_db_password
      MARIADB_BO_RO_PASSWORD_FILE: /run/secrets/bo_db_password
      ORBE_PROBE_API_KEY_FILE: /run/secrets/probe_api_key
    secrets:
      - db_root_password
      - auth_db_password
      - payment_db_password
      - remediation_db_password
      - exporter_db_password
      - bo_db_password
      - probe_api_key
    volumes:
      - ./infra/mariadb/seed/90-demo-data.sql:/docker-entrypoint-initdb.d/90-demo-data.sql:ro
      - mariadb-test-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30
    mem_limit: 384m
    restart: unless-stopped

  auth-service:
    image: orbe-dev-auth-service:latest
    container_name: auth-service
    environment:
      AUTH_DB_HOST: mariadb
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      AUTH_FACE_KEY_FILE: /run/secrets/face_embedding_key
      AUTH_FACE_ENGINE: fake
      AUTH_ENABLE_DOCS: "true"
      AUTH_LOG_LEVEL: INFO
    secrets: [auth_db_password, jwt_private_key, face_embedding_key]
    volumes:
      - ./services/auth-service/app:/opt/venv/lib/python3.12/site-packages/app:ro
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "127.0.0.1:8001:8001"
    mem_limit: 384m
    restart: unless-stopped

  oorbe-payment-service:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-payment }
    container_name: oorbe-payment-service
    environment:
      PAYMENT_DB_HOST: mariadb
      PAYMENT_DB_PASSWORD_FILE: /run/secrets/payment_db_password
      PAYMENT_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      PAYMENT_ENABLE_DOCS: "true"
      PAYMENT_LOG_LEVEL: INFO
    secrets: [payment_db_password, jwt_public_key]
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "127.0.0.1:8002:8002"
    mem_limit: 256m
    restart: unless-stopped

  oorbe-bo-api:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-bo }
    container_name: oorbe-bo-api
    environment:
      BO_AUTH_URL: http://auth-service:8001
      BO_PROMETHEUS_URL: http://prometheus:9090
      BO_LOKI_URL: ""
      BO_REMEDIATION_URL: http://remediation-engine:8003
      BO_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      BO_DB_HOST: mariadb
      BO_DB_PASSWORD_FILE: /run/secrets/bo_db_password
      BO_ENABLE_DOCS: "true"
      BO_LOG_LEVEL: INFO
    secrets: [jwt_public_key, bo_db_password]
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      mariadb: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus-rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
    mem_limit: 256m
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    mem_limit: 128m
    restart: unless-stopped

  detector-ml:
    image: orbe/detector-ml:latest
    container_name: detector-ml
    environment:
      DETECTOR_PROMETHEUS_URL: http://prometheus:9090
      DETECTOR_INTERVAL_SECONDS: "5"
      DETECTOR_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8004:8004"
    mem_limit: 192m
    restart: unless-stopped

  remediation-engine:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-remediation }
    container_name: remediation-engine
    environment:
      REMEDIATION_PAYMENT_URL: http://oorbe-payment-service:8002
      REMEDIATION_BLOCKLIST_PATH: /etc/nginx/blocklist/blocklist.conf
      REMEDIATION_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - ./infra/waf/blocklist:/etc/nginx/blocklist
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      - oorbe-payment-service
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      MODSEC_RULE_ENGINE: "DetectionOnly"
      PARANOIA: "1"
    volumes:
      - ./infra/waf/vhosts.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./infra/waf/blocklist:/etc/nginx/blocklist:ro
      - ./infra/waf/certs:/etc/nginx/certs:ro
    depends_on:
      - oorbe-payment-service
      - remediation-engine
    restart: unless-stopped

volumes:
  mariadb-test-data:

secrets:
  db_root_password:        { file: ./secrets/db_root_password }
  auth_db_password:        { file: ./secrets/auth_db_password }
  payment_db_password:     { file: ./secrets/payment_db_password }
  remediation_db_password: { file: ./secrets/remediation_db_password }
  exporter_db_password:    { file: ./secrets/exporter_db_password }
  bo_db_password:          { file: ./secrets/bo_db_password }
  probe_api_key:           { file: ./secrets/probe_api_key }
  jwt_private_key:         { file: ./secrets/jwt_private_key.pem }
  jwt_public_key:          { file: ./secrets/jwt_public_key.pem }
  face_embedding_key:      { file: ./secrets/face_embedding_key }
