# Relais de la pile dev pour la carte LED : seule la route GET /devices/led d'auth-service
# est accessible depuis le réseau local (comme le WAF de la pile de démonstration).
server {
    listen 8080;
    server_tokens off;

    # Résolution à chaque requête : auth-service peut redémarrer et changer d'adresse
    resolver 127.0.0.11 valid=10s;
    set $auth http://auth-service:8001;

    location = /devices/led {
        limit_except GET { deny all; }
        proxy_pass $auth;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
