# Prometheus de la pile de développement (docker-compose.dev.yml, profil « obs »).
# Même principe que infra/prometheus.yml, avec les noms de services de la pile de dev.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:8002']

  - job_name: 'bo-api'
    static_configs:
      - targets: ['bo-api:8006']
