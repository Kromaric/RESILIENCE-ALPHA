# HTTP -> HTTPS
server {
    listen 8080;
    server_name payment.oorbe.fr dashboard.oorbe.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name payment.oorbe.fr;

    ssl_certificate     /etc/nginx/certs/oorbe.crt;
    ssl_certificate_key /etc/nginx/certs/oorbe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # LED du poste back-office (carte ESP32 sur le hotspot) : route d'auth-service en lecture
    # seule ; la clé d'appareil (X-Device-Key) est vérifiée par auth-service.
    location = /devices/led {
        limit_except GET { deny all; }
        set $led_upstream http://oorbe-auth-service:8001;
        proxy_pass $led_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API de l'app (comme le proxy de Vite en dev) : préfixe retiré avant le service.
    # Corps jusqu'à 12 Mo : images de la caméra pour la reconnaissance faciale.
    location /api/auth/ {
        set $auth http://oorbe-auth-service:8001;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    location /api/payments/ {
        set $payments http://oorbe-payment-service:8002;
        rewrite ^/api/payments/(.*)$ /$1 break;
        proxy_pass $payments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $upstream http://oorbe-interface:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8443 ssl;
    server_name dashboard.oorbe.fr;

    ssl_certificate     /etc/nginx/certs/oorbe.crt;
    ssl_certificate_key /etc/nginx/certs/oorbe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # LED du poste back-office (carte ESP32 sur le hotspot) : route d'auth-service en lecture
    # seule ; la clé d'appareil (X-Device-Key) est vérifiée par auth-service.
    location = /devices/led {
        limit_except GET { deny all; }
        set $led_upstream http://oorbe-auth-service:8001;
        proxy_pass $led_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API du back-office (comme le proxy de Vite en dev) : même origine pour le navigateur.
    # Corps jusqu'à 12 Mo : images de la caméra USB pour la connexion par visage.
    location /bo/ {
        set $bo_api http://oorbe-bo-api:8006;
        proxy_pass $bo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    location / {
        set $upstream http://oorbe-dashboard:8083;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
