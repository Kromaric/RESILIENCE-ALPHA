# HTTP -> HTTPS
server {
    listen 8080;
    server_name payment.oorbe.fr payments.oorbe.fr dashboard.oorbe.fr;
    return 301 https://$host$request_uri;
}

# Dynamic blocklist fed by remediation-engine
geo $remote_addr $is_blocked {
    default 0;
    include /etc/nginx/blocklist/blocklist.conf;
}

server {
    listen 8443 ssl;
    server_name payment.oorbe.fr payments.oorbe.fr;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/certs/oorbe.crt;
    ssl_certificate_key /etc/nginx/certs/oorbe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # Dynamic containment / IP blocklist check
    if ($is_blocked) {
        return 403 "Blocked by Orbe Remediation Engine\n";
    }

    # LED du poste back-office (carte ESP32 sur le hotspot) : route d'auth-service en lecture
    # seule ; la clé d'appareil (X-Device-Key) est vérifiée par auth-service.
    location = /devices/led {
        limit_except GET { deny all; }
        set $led_upstream http://oorbe-auth-service:8001;
        proxy_pass $led_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API de l'app (comme le proxy de Vite en dev) : préfixe retiré avant le service.
    # Corps jusqu'à 12 Mo : images de la caméra pour la reconnaissance faciale.
    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        set $auth_svc http://oorbe-auth-service:8001;
        proxy_pass $auth_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    # API Paiements (CADRAGE §4.1)
    location /api/payments/ {
        rewrite ^/api/payments/(.*)$ /$1 break;
        set $payment_svc http://oorbe-payment-service:8002;
        proxy_pass $payment_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Route directe /pay pour scripts redteam et compatibilité
    location /pay {
        set $payment_svc http://oorbe-payment-service:8002;
        proxy_pass $payment_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Statut public pour le frontend
    location /api/status {
        rewrite ^/api/status.*$ /status/public break;
        set $status_svc http://remediation-engine:8003;
        proxy_pass $status_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend interface client
    location / {
        set $interface_svc http://oorbe-interface:8081;
        proxy_pass $interface_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8443 ssl;
    server_name dashboard.oorbe.fr;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/nginx/certs/oorbe.crt;
    ssl_certificate_key /etc/nginx/certs/oorbe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # LED du poste back-office (carte ESP32 sur le hotspot) : route d'auth-service en lecture
    # seule ; la clé d'appareil (X-Device-Key) est vérifiée par auth-service.
    location = /devices/led {
        limit_except GET { deny all; }
        set $led_upstream http://oorbe-auth-service:8001;
        proxy_pass $led_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API du back-office (comme le proxy de Vite en dev) : même origine pour le navigateur.
    # Corps jusqu'à 12 Mo : images de la caméra USB pour la connexion par visage.
    # Assistant opérateur : un modèle 7–8B sur CPU peut mettre jusqu'à ~2 min (bo-api : 160 s)
    location /bo/assistant/ {
        set $bo_api http://oorbe-bo-api:8006;
        proxy_pass $bo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location /bo/ {
        set $bo_api_svc http://oorbe-bo-api:8006;
        proxy_pass $bo_api_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    # Frontend dashboard back-office
    location / {
        set $dashboard_svc http://oorbe-dashboard:8083;
        proxy_pass $dashboard_svc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
