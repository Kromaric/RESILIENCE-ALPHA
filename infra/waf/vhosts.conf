# HTTP -> HTTPS
server {
    listen 8080;
    server_name payment.oorbe.fr dashboard.oorbe.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name payment.oorbe.fr;

    ssl_certificate     /etc/nginx/certs/oorbe.crt;
    ssl_certificate_key /etc/nginx/certs/oorbe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # LED du poste back-office (carte ESP32 sur le hotspot) : seule route d'auth-service
    # exposée, en lecture seule ; la clé d'appareil (X-Device-Key) est vérifiée par auth-service.
    location = /devices/led {
        limit_except GET { deny all; }
        set $led_upstream http://oorbe-auth-service:8001;
        proxy_pass $led_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $upstream http://oorbe-interface:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8443 ssl;
    server_name dashboard.oorbe.fr;

    ssl_certificate     /etc/nginx/certs/oorbe.crt;
    ssl_certificate_key /etc/nginx/certs/oorbe.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_tokens off;

    # LED du poste back-office (carte ESP32 sur le hotspot) : seule route d'auth-service
    # exposée, en lecture seule ; la clé d'appareil (X-Device-Key) est vérifiée par auth-service.
    location = /devices/led {
        limit_except GET { deny all; }
        set $led_upstream http://oorbe-auth-service:8001;
        proxy_pass $led_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $upstream http://oorbe-dashboard:8083;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
