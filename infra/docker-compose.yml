# Assistant opérateur (assistant-rag ; le modèle tourne sur la VM Ollama, infra/ollama/) : inclus ici.
include:
  - docker-compose.rag.yml

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    privileged: true

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      # Panneaux intégrés dans le dashboard Orbe : intégration autorisée, lecture anonyme
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    secrets: [grafana_admin_password]
    restart: unless-stopped


############## SERVICES OORBE  ############

  oorbe-auth-service:
    build:
      context: ..
      dockerfile: ./dockerfiles/Dockerfile-auth
    container_name: oorbe-auth-service
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 256M       # RAM minimale garantie par le système
    environment:
      AUTH_DB_HOST: mariadb
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      AUTH_FACE_ENGINE: insightface   # modèle embarqué dans l'image (buffalo_s)
      AUTH_FACE_KEY_FILE: /run/secrets/face_embedding_key
      # Secrets lus dans Vault (repli : fichiers /run/secrets), voir app/vault.py
    secrets: [auth_db_password, jwt_private_key, face_embedding_key]
    depends_on:
      mariadb: { condition: service_healthy }
    expose:
      - "8001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  oorbe-payment-service:
    build:
      context: ..
      dockerfile: ./dockerfiles/Dockerfile-payment
    container_name: oorbe-payment-service
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          memory: 256M # RAM minimale garantie par le système
    environment:
      PAYMENT_DB_HOST: mariadb
      PAYMENT_DB_PASSWORD_FILE: /run/secrets/payment_db_password
      PAYMENT_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      # Secrets lus dans Vault (repli : fichiers /run/secrets), voir app/vault.py
      PAYMENT_VAULT_ADDR: http://vault:8200
      PAYMENT_VAULT_KV_PATH: secret/data/oorbe/config
      PAYMENT_VAULT_TOKEN_FILE: /run/secrets/oorbe_vault_token
    secrets: [payment_db_password, jwt_public_key, oorbe_vault_token]
    depends_on:
      mariadb: { condition: service_healthy }
    expose:
      - "8002"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped


  oorbe-dashboard:
    build:
      context: ..
      dockerfile: ./dockerfiles/Dockerfile-dashboard
    container_name: oorbe-dashboard
    expose:
      - "8083"
    #ports:
    #  - "8083:8083"
    restart: unless-stopped

  oorbe-interface:
    build:
      context: ..
      dockerfile: ./dockerfiles/Dockerfile-interface
    container_name: oorbe-interface
    expose:
      - "8081"
    #ports:
    #  - "8081:8081"
    restart: unless-stopped

  oorbe-bo-api:
    build:
      context: ..
      dockerfile: ./dockerfiles/Dockerfile-bo
    container_name: oorbe-bo-api
    environment:
      BO_AUTH_URL: http://oorbe-auth-service:8001
      BO_PROMETHEUS_URL: http://prometheus:9090
      BO_LOKI_URL: http://loki:3100
      BO_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      BO_DB_HOST: mariadb
      BO_DB_PASSWORD_FILE: /run/secrets/bo_db_password
      # Secrets lus dans Vault (repli : fichiers /run/secrets), voir app/vault.py
      BO_VAULT_ADDR: http://vault:8200
      BO_VAULT_KV_PATH: secret/data/oorbe/config
      BO_VAULT_TOKEN_FILE: /run/secrets/oorbe_vault_token
    secrets: [jwt_public_key, bo_db_password, oorbe_vault_token]
    depends_on:
      - oorbe-auth-service
      - mariadb
    ports:
      - "8006:8006"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    restart: unless-stopped

  detector-ml:
    build:
      context: ..
      dockerfile: ./dockerfiles/Dockerfile-detector
    container_name: detector-ml
    environment:
      DETECTOR_PROMETHEUS_URL: http://prometheus:9090
      DETECTOR_LOKI_URL: http://loki:3100
    volumes:
      - ../ml/models:/models:ro   # modèle produit par ml/train.py + ml/evaluate.py
    depends_on: [prometheus, loki]
    expose:
      - "8004"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  remediation-engine:
    build:
      context: ..
      dockerfile: ./dockerfiles/Dockerfile-remediation
    container_name: remediation-engine
    environment:
      REMEDIATION_PROMETHEUS_URL: http://prometheus:9090
      REMEDIATION_LOKI_URL: http://loki:3100
      REMEDIATION_BLOCKLIST_PATH: /etc/nginx/blocklist/blocklist.conf
      REMEDIATION_PAYMENT_URL: http://oorbe-payment-service:8002
      REMEDIATION_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - ./waf/blocklist:/etc/nginx/blocklist
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8003:8003"
    depends_on:
      - loki
      - oorbe-payment-service
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTH_SVC_PASSWORD_FILE: /run/secrets/auth_db_password
      MARIADB_PAYMENT_SVC_PASSWORD_FILE: /run/secrets/payment_db_password
      MARIADB_REMEDIATION_RO_PASSWORD_FILE: /run/secrets/remediation_db_password
      MARIADB_EXPORTER_PASSWORD_FILE: /run/secrets/exporter_db_password
      MARIADB_BO_RO_PASSWORD_FILE: /run/secrets/bo_db_password
      ORBE_PROBE_API_KEY_FILE: /run/secrets/probe_api_key
    secrets:
      - db_root_password
      - auth_db_password
      - payment_db_password
      - remediation_db_password
      - exporter_db_password
      - bo_db_password
      - probe_api_key
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/conf.d/orbe.cnf:/etc/mysql/conf.d/orbe.cnf:ro
      - ./mariadb/init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30
    mem_limit: 512m

  vault:
    image: hashicorp/vault:1.15.4
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
    cap_add:
      - IPC_LOCK
    command: server
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      MODSEC_RULE_ENGINE: "On"           # "DetectionOnly" pour tester sans bloquer
      PARANOIA: "1"
    volumes:
      - ./waf/vhosts.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/blocklist:/etc/nginx/blocklist:ro
      - ./waf/certs:/etc/nginx/certs:ro
    depends_on:
      - oorbe-dashboard
      - oorbe-interface
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  mariadb_data:
  vault_data:

secrets:
  db_root_password:        { file: ../secrets/db_root_password }
  auth_db_password:        { file: ../secrets/auth_db_password }
  payment_db_password:     { file: ../secrets/payment_db_password }
  remediation_db_password: { file: ../secrets/remediation_db_password }
  exporter_db_password:    { file: ../secrets/exporter_db_password }
  bo_db_password:          { file: ../secrets/bo_db_password }
  grafana_admin_password:  { file: ../secrets/grafana_admin_password }
  # Jeton Vault des services : politique en lecture seule sur secret/data/oorbe/config
  oorbe_vault_token:       { file: ../secrets/oorbe_vault_token }
  probe_api_key:           { file: ../secrets/probe_api_key }
  jwt_private_key:         { file: ../secrets/jwt_private_key.pem }
  jwt_public_key:          { file: ../secrets/jwt_public_key.pem }
  face_embedding_key:      { file: ../secrets/face_embedding_key }
