# Règles d'alerte de la détection (CADRAGE §6.4).
groups:
  - name: anomaly
    interval: 3s
    rules:
      # Détection ML standard
      - alert: PaymentAnomaly
        expr: anomaly_score{target="payment-service"} > on(target) anomaly_threshold{target="payment-service"}
        for: 5s
        labels:
          severity: critical
          incident_type: resource_exhaustion
          target: payment-service
        annotations:
          summary: "Comportement anormal de payment-service (score {{ $value | printf \"%.2f\" }})"
          details: "GET http://detector-ml:8004/score pour les variables en cause (top_deviations)"

      # Détection d'épuisement de ressources (gros payloads / saturation CPU / mémoire)
      - alert: PaymentResourceExhaustion
        expr: sum(rate(http_request_size_bytes_sum{job=~"payment-service.*"}[10s])) > 100000 or sum(rate(http_requests_total{job=~"payment-service.*",status=~"4xx|5xx"}[10s])) > 10
        for: 3s
        labels:
          severity: critical
          incident_type: resource_exhaustion
          target: payment-service
        annotations:
          summary: "Saturation des ressources et volume excessif de requêtes sur payment-service"

      # Détection rapide d'inondation de trafic / DoS (> 15 req/s pendant 3s)
      - alert: PaymentTrafficFlooding
        expr: sum(rate(http_requests_total{job=~"payment-service.*"}[10s])) > 15
        for: 3s
        labels:
          severity: critical
          incident_type: resource_exhaustion
          target: payment-service
        annotations:
          summary: "Inondation massive de requêtes sur payment-service"

      # Détecteur indisponible
      - alert: DetectorDown
        expr: up{job="detector-ml"} == 0 or time() - detector_last_success_timestamp_seconds > 30
        for: 15s
        labels:
          severity: warning
          target: detector-ml
