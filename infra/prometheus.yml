global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # CIBLE COMMANDE POUR LE DASHBOARD CPU/RAM/DISQUE
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Services métier (métriques HTTP, pool de connexions, paiements, connexions)
  - job_name: 'auth-service'
    static_configs:
      - targets: ['oorbe-auth-service:8001']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['oorbe-payment-service:8002']
