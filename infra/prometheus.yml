global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Services métier (métriques HTTP, pool de connexions, paiements, connexions)
  - job_name: 'payment-service'
    static_configs:
      - targets: ['oorbe-payment-service:8002']

  # Détection ML (score d'anomalie, CADRAGE §4.5)
  - job_name: 'detector-ml'
    static_configs:
      - targets: ['detector-ml:8004']

  # Moteur de remédiation
  - job_name: 'remediation-engine'
    static_configs:
      - targets: ['remediation-engine:8003']
