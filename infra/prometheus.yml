global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # CIBLE COMMANDE POUR LE DASHBOARD CPU/RAM/DISQUE
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Duplique le label 'name' en 'container' pour le rendre compatible avec les dashboards standard
      - source_labels: [name]
        target_label: container

  # Services métier (métriques HTTP, pool de connexions, paiements, connexions)
  - job_name: 'auth-service'
    static_configs:
      - targets: ['oorbe-auth-service:8001']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['oorbe-payment-service:8002']

  - job_name: 'bo-api'
    static_configs:
      - targets: ['oorbe-bo-api:8006']

  # Détection ML (score d'anomalie, CADRAGE §4.5)
  - job_name: 'detector-ml'
    static_configs:
      - targets: ['detector-ml:8004']

  # Moteur de remédiation
  - job_name: 'remediation-engine'
    static_configs:
      - targets: ['remediation-engine:8003']
