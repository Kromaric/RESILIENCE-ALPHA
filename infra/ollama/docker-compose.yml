version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "11434:11434"
    volumes:
      - ./init-ollama.sh:/init-ollama.sh
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "/init-ollama.sh"]

volumes:
  ollama_data:
