# Orbe — VM dédiée au modèle de langage (Proxmox, 32 Go). CADRAGE §10, sujet §4 :
# la machine de délestage IA « n'héberge que le modèle local et son interface d'accès ».
#
# Sur la VM (Linux + Docker), dans ce dossier :
#   cp .env.example .env      # renseigner OLLAMA_PROXY_TOKEN (même valeur que secrets/ollama_token)
#   docker compose up -d
#   docker compose logs -f ollama-init
#
# Seul le proxy est publié (port 11434). Il exige le jeton et n'ouvre que les routes utilisées par
# l'assistant ; l'API d'Ollama elle-même n'a aucune authentification et permet de télécharger
# ou supprimer des modèles. Filtrer aussi le port au pare-feu Proxmox : PC Hôte uniquement
# (voir README.md).

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

x-ollama-env: &ollama-env
  OLLAMA_HOST: 0.0.0.0:11434
  OLLAMA_MODELS: /models
  HOME: /tmp
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
  EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}

services:
  # Télécharge les modèles dans le volume, puis s'arrête. Seul conteneur avec accès à Internet.
  # Un modèle déjà présent n'est pas retéléchargé : la VM redémarre aussi hors ligne.
  ollama-init:
    image: ollama/ollama:0.9.0
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    restart: "no"
    environment: *ollama-env
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    volumes:
      - ollama-models:/models
      - ./pull-models.sh:/pull-models.sh:ro
    networks: [egress]

  # Sert le LLM et les embeddings. Réseau interne : ni Internet, ni port publié.
  # Exception de durcissement documentée : l'image officielle tourne en root (sans aucune
  # capacité Linux, système de fichiers en lecture seule hors du volume des modèles).
  ollama:
    image: ollama/ollama:0.9.0
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *ollama-env
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-60m}   # modèle gardé en mémoire entre deux questions
      OLLAMA_NUM_PARALLEL: "1"                       # CPU : une génération à la fois
      OLLAMA_MAX_LOADED_MODELS: "2"                  # LLM + modèle d'embeddings
    volumes:
      - ollama-models:/models
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    networks: [internal]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    mem_limit: ${OLLAMA_MEM_LIMIT:-24g}
    cpus: ${OLLAMA_CPUS:-8}
    pids_limit: 512

  # Seul point d'entrée : jeton obligatoire, routes d'inférence uniquement.
  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    <<: *hardening
    environment:
      OLLAMA_PROXY_TOKEN: ${OLLAMA_PROXY_TOKEN:?OLLAMA_PROXY_TOKEN manquant dans .env}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      ollama: { condition: service_healthy }
    networks: [internal, public]
    ports:
      - "${OLLAMA_BIND:-0.0.0.0}:11434:11434"
    mem_limit: 64m
    pids_limit: 64

networks:
  internal:
    internal: true   # ollama ↔ proxy
  egress: {}         # ollama-init (téléchargement des modèles)
  public: {}         # publication du port du proxy

volumes:
  ollama-models:
