# Complément de docker-compose.dev.yml pour tester la carte LED en local :
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.led.yml up -d --build
#
# Publie sur le réseau local (port 8011, HTTP) un relais qui ne laisse passer que
# GET /devices/led vers auth-service ; le reste de l'API reste sur 127.0.0.1.
# Dans arduino_secrets.h : BACKEND_HOST = IP du PC, BACKEND_PORT 8011, BACKEND_HTTPS 0.

services:
  led-gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./infra/dev/led-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [auth-service]
    ports:
      - "8011:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    restart: unless-stopped
