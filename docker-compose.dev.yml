# Orbe — environnement de développement local : MariaDB + auth-service + payment-service
# + bo-api.
# Ce n'est PAS la pile de démonstration (pas de WAF, d'observabilité ni de remédiation) :
# celle-ci est infra/docker-compose.yml, construite par l'équipe infra. Les deux utilisent
# les mêmes Dockerfiles (dockerfiles/).
#
# Démarrage (voir README, section « Lancer en local ») :
#   services/auth-service/.venv/Scripts/python scripts/init_dev_secrets.py
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Swagger : http://localhost:8001/docs (auth) · http://localhost:8002/docs (paiement)
#           http://localhost:8006/docs (back-office du dashboard)

name: orbe-dev

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  restart: unless-stopped

services:
  mariadb:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-mariadb }  # schéma, comptes, configuration
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_AUTH_SVC_PASSWORD_FILE: /run/secrets/auth_db_password
      MARIADB_PAYMENT_SVC_PASSWORD_FILE: /run/secrets/payment_db_password
      MARIADB_REMEDIATION_RO_PASSWORD_FILE: /run/secrets/remediation_db_password
      MARIADB_EXPORTER_PASSWORD_FILE: /run/secrets/exporter_db_password
      MARIADB_BO_RO_PASSWORD_FILE: /run/secrets/bo_db_password
      ORBE_PROBE_API_KEY_FILE: /run/secrets/probe_api_key
    secrets:
      - db_root_password
      - auth_db_password
      - payment_db_password
      - remediation_db_password
      - exporter_db_password
      - bo_db_password
      - probe_api_key
    volumes:
      # données de démo : environnement de développement uniquement
      - ./infra/mariadb/seed/90-demo-data.sql:/docker-entrypoint-initdb.d/90-demo-data.sql:ro
      - mariadb-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"   # pour un client SQL local ; jamais exposé au hotspot
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  auth-service:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-auth }
    <<: *hardening
    environment:
      AUTH_DB_HOST: mariadb
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      AUTH_FACE_KEY_FILE: /run/secrets/face_embedding_key
      # Moteur InsightFace pour la reconnaissance faciale avec caméra réelle
      AUTH_FACE_ENGINE: insightface
      AUTH_ENABLE_DOCS: "true"
      AUTH_LOG_LEVEL: INFO
    secrets: [auth_db_password, jwt_private_key, face_embedding_key, led_device_key]
    volumes:
      - ./services/auth-service/app:/opt/venv/lib/python3.12/site-packages/app:ro
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "127.0.0.1:8001:8001"
    mem_limit: 1g

  payment-service:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-payment }
    <<: *hardening
    environment:
      PAYMENT_DB_HOST: mariadb
      PAYMENT_DB_PASSWORD_FILE: /run/secrets/payment_db_password
      PAYMENT_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      PAYMENT_ENABLE_DOCS: "true"
      PAYMENT_LOG_LEVEL: INFO
    secrets: [payment_db_password, jwt_public_key]
    volumes:
      - ./services/payment-service/app:/usr/local/lib/python3.12/site-packages/app:ro
    depends_on:
      mariadb: { condition: service_healthy }
    ports:
      - "127.0.0.1:8002:8002"
    mem_limit: 256m

  bo-api:
    build: { context: ., dockerfile: dockerfiles/Dockerfile-bo }
    <<: *hardening
    environment:
      BO_AUTH_URL: http://auth-service:8001
      BO_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      BO_DB_HOST: mariadb
      BO_DB_PASSWORD_FILE: /run/secrets/bo_db_password
      # Supervision : profil « obs » (sans lui, ces routes répondent « indisponible »)
      BO_PROMETHEUS_URL: http://prometheus:9090
      BO_LOKI_URL: http://loki:3100
      BO_LOKI_SELECTOR: '{container=~"orbe-dev-.+"}'
      BO_DISK_MOUNTPOINT: /var/lib   # Docker Desktop : pas de « / » côté node-exporter
      BO_CORS_ORIGINS: '["http://localhost:5173"]'   # dashboard lancé avec « npm run dev »
      BO_ENABLE_DOCS: "true"
      BO_LOG_LEVEL: INFO
    secrets: [jwt_public_key, bo_db_password]
    depends_on:
      auth-service: { condition: service_healthy }
    ports:
      - "127.0.0.1:8006:8006"
    mem_limit: 128m

  # --- Observabilité (optionnelle) : docker compose -f docker-compose.dev.yml --profile obs up -d
  prometheus:
    image: prom/prometheus:v2.53.1
    profiles: [obs]
    volumes:
      - ./infra/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [obs]
    pid: host
    volumes:
      - /:/host:ro
    command: ["--path.rootfs=/host"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    profiles: [obs]
    volumes:
      - ./infra/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    profiles: [obs]
    volumes:
      - ./infra/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.1.4
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./infra/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

secrets:
  db_root_password:        { file: ./secrets/db_root_password }
  auth_db_password:        { file: ./secrets/auth_db_password }
  payment_db_password:     { file: ./secrets/payment_db_password }
  remediation_db_password: { file: ./secrets/remediation_db_password }
  exporter_db_password:    { file: ./secrets/exporter_db_password }
  bo_db_password:          { file: ./secrets/bo_db_password }
  grafana_admin_password:  { file: ./secrets/grafana_admin_password }
  probe_api_key:           { file: ./secrets/probe_api_key }
  led_device_key:          { file: ./secrets/led_device_key }   # ESP8266 (GET /devices/led)
  jwt_private_key:         { file: ./secrets/jwt_private_key.pem }
  jwt_public_key:          { file: ./secrets/jwt_public_key.pem }
  face_embedding_key:      { file: ./secrets/face_embedding_key }

volumes:
  mariadb-data:
