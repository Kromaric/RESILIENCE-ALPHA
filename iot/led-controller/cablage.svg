mal" fill="#d64545" text-anchor="middle">fil vers D26 (GPIO 26)</text><text x="470" y="586" font-size="13" font-weight="normal" fill="#1d2427" text-anchor="middle">fil vers GND</text><rect x="40" y="610" width="640" height="130" rx="8" fill="#f4f6f7" stroke="#dde3e6"/><text x="58" y="634" font-size="15" font-weight="bold" fill="#1d2427" text-anchor="start">Repérer les pattes de la LED</text><text x="58" y="660" font-size="14" font-weight="normal" fill="#1d2427" text-anchor="start">+  anode : patte LONGUE → côté résistance (vers la broche D25 ou D26)</text><text x="58" y="684" font-size="14" font-weight="normal" fill="#1d2427" text-anchor="start">−  cathode : patte COURTE, côté PLAT du boîtier → masse (GND)</text><text x="58" y="710" font-size="13" font-weight="normal" fill="#5d6a70" text-anchor="start" font-style="italic">La résistance peut aussi être placée côté cathode : seul le sens de la LED compte.</text></svg>